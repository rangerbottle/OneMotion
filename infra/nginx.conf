events {}

http {
  server {
    listen 8080;
    server_name _;
    client_max_body_size 51m;

    # Docker's embedded DNS, so recreated api/web containers (new IPs) keep
    # resolving instead of leaving nginx pinned to stale addresses.
    resolver 127.0.0.11 valid=10s;

    set $api_upstream "http://api:8000";
    set $web_upstream "http://web:3000";

    location /api/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 180s;
      proxy_request_buffering off;
    }

    location = /health {
      proxy_pass $api_upstream/health;
    }

    location = /ready {
      proxy_pass $api_upstream/ready;
    }

    location / {
      proxy_pass $web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
